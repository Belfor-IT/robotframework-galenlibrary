<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GalenLibrary long page</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  #header { position: sticky; top: 0; height: 60px; background: #123456; color: #fff; z-index: 10; }
  #header span { display: inline-block; margin: 18px 16px; }
  .section { height: 200px; box-sizing: border-box; padding: 16px; font-size: 20px; }
  .section:nth-child(odd) { background: #fde7c8; }
  .section:nth-child(even) { background: #d8ecf7; }
  #footer { height: 120px; background: #333; color: #fff; padding: 16px; box-sizing: border-box; }
  #footer-box { width: 200px; height: 60px; background: #e67e22; }
</style>
</head>
<body>
<div id="header"><span>Sticky header</span></div>
<div id="sections"></div>
<div id="footer"><div id="footer-box"></div></div>
<script>
  // 30 sections of 200px: the page is about 6200px high.
  var sections = document.getElementById('sections');
  for (var i = 1; i <= 30; i++) {
    var div = document.createElement('div');
    div.className = 'section';
    div.id = 'section-' + i;
    div.textContent = 'Section ' + i;
    sections.appendChild(div);
  }
</script>
</body>
</html>
