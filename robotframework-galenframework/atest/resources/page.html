<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Galen demo page</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #header { height: 80px; background: #234; color: white; display: flex; align-items: center; }
    #box { width: 40px; height: 40px; margin-left: 20px; background: #f80; }
    .item { display: inline-block; width: 100px; height: 50px; margin-right: 10px; background: #9bd; vertical-align: top; }
    #menu { height: 40px; background: #ccc; }
    #content { padding: 20px; }
    #side-panel { position: absolute; top: 120px; right: 0; width: 200px; height: 300px; background: #eee; }
    @media (max-width: 600px) { #side-panel { display: none; } }
  </style>
</head>
<body>
  <div id="header">Header<div id="box"></div></div>
  <div id="menu">Menu</div>
  <div id="content">Content<br><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>
  <div id="side-panel">Side panel</div>
</body>
</html>
